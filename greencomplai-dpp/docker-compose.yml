services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dpp
      POSTGRES_PASSWORD: dpp
      POSTGRES_DB: dpp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpp -d dpp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: greencomplai-dpp-minio:local
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Optional: upload malware scanning. Started only with
  # `docker compose --profile scan up -d`, because clamd wants ~1 GB RAM and most
  # local work does not need it. Point CLAMAV_HOST=localhost at it to use it.
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres-data:
  minio-data:
  clamav-data:
